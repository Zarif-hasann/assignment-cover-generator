<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#f6f7f9;--card:#fff;--tx:#1d2330;--mu:#6b7280;--bd:#d8dce3;--ac:#1f5fd6}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#14171c;--card:#1d2128;--tx:#e8eaee;--mu:#9aa3b2;--bd:#343a45;--ac:#6ea0ff}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.5 system-ui,sans-serif}
.w{max-width:1000px;margin:auto;padding:20px;display:grid;gap:20px;grid-template-columns:1fr 1fr}
@media(max-width:800px){.w{grid-template-columns:1fr}}
h1{font-size:22px;margin:0 0 4px;grid-column:1/-1}p.s{color:var(--mu);margin:0 0 8px;grid-column:1/-1}
.c{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:16px}
label{display:block;font-size:13px;color:var(--mu);margin:10px 0 3px}
input,select,textarea{width:100%;padding:9px;border:1px solid var(--bd);border-radius:8px;background:var(--bg);color:var(--tx);font:inherit}
h3{margin:16px 0 0;font-size:14px;color:var(--ac)}
button{margin-top:16px;padding:11px 16px;border:0;border-radius:8px;background:var(--ac);color:#fff;font:inherit;font-weight:600;cursor:pointer;width:100%}
iframe{width:100%;height:560px;border:1px solid var(--bd);border-radius:8px;background:#fff}
.n{color:var(--mu);font-size:13px;margin-top:8px}
</style></head><body><div class="w">

function mk(){doc=new jspdf.jsPDF({unit:"mm",format:"a4"});doc.setLineWidth(.35);return doc}
function ct(t,x,y,w,lh,st="bold",sz=11){doc.setFont("times",st);doc.setFontSize(sz);const l=doc.splitTextToSize(t,w);doc.text(l,x,y,{align:"center"});return y+l.length*lh}
function lv(l,v,cx,y,sz=11){doc.setFontSize(sz);doc.setFont("times","bold");const a=doc.getTextWidth(l+" ");doc.setFont("times","normal");const b=doc.getTextWidth(v);let x=cx-(a+b)/2;doc.setFont("times","bold");doc.text(l,x,y);doc.setFont("times","normal");doc.text(v,x+a,y)}
function left(ls,x,y,w,st,sz=10.5,lh=5){doc.setFont("times",st);doc.setFontSize(sz);for(const t of ls){if(!t)continue;const l=doc.splitTextToSize(t,w);doc.text(l,x,y);y+=l.length*lh}return y}
function poly(p,sx,sy){const P=p.map(a=>[a[0]*sx,a[1]*sy]);doc.setFillColor(205,205,205);doc.lines(P.slice(1).map((a,i)=>[a[0]-P[i][0],a[1]-P[i][1]]),P[0][0],P[0][1],[1,1],"F",true)}
function l1(){const X=p=>p*.4988,Y=p=>p*.55,c=105.5;
doc.rect(26,15,159,271);let y=ct(V("fac"),c,Y(60),135,5.2,"bold",11)+3;ct(V("uni"),c,y,135,5.2,"bold",11);
const im=$("logo"),w=48,h=w*im.naturalHeight/im.naturalWidth;doc.addImage(im,"PNG",c-w/2,Y(120),w,h);
lv("Course Title:",V("ct"),c,Y(247),11);lv("Course Code:",V("cc"),c,Y(268),11);
doc.rect(28,Y(290),156,Y(466)-Y(290));doc.line(105.7,Y(290),105.7,Y(466));
ct("Submitted By",67,Y(312),70,5,"bold",12);ct("Submitted To",145,Y(312),70,5,"bold",12);
left([V("name"),V("id")&&"ID: "+V("id"),V("reg")&&"Reg. No: "+V("reg"),V("ses")&&"Session: "+V("ses"),V("lvl")],31,Y(334),72,"bold");
left([V("info")],31,Y(334)+5*[V("name"),V("id"),V("reg"),V("ses"),V("lvl")].filter(Boolean).length,72,"normal");
left([V("tn"),V("td"),V("tdep")],109,Y(334),72,"bold");
lv("Date Of Submission:",V("date")?V("date").split("-").reverse().join("-"):"",c,Y(490),11)}
function l2(){const s=.5966,t=.6,c=105;
poly([[30,7],[80,7],[65,20],[15,20]],s,t);poly([[84,16],[96,16],[91,22],[79,22]],s,t);poly([[240,458],[352,458],[352,495],[222,495]],s,t);
let y=ct(V("uni"),c,43,150,6,"bold",15)+1;y=ct("Assignment On",c,y+1,150,6,"bold",14);
y=ct(V("topic"),c,y+4,130,5.5,"bold",12);
lv("Course Title:",V("ct"),c,Math.max(y+14,96),11.5);lv("Course Code:",V("cc"),c,Math.max(y+14,96)+10,11.5);
const a=[["Submitted By: "+V("name")],V("id")&&"ID: "+V("id"),V("sec")&&"Section: "+V("sec"),V("sem"),V("dept")].flat().filter(Boolean);
doc.setFont("times","normal");doc.setFontSize(10.5);const al=a.flatMap(x=>doc.splitTextToSize(x,76));let h=al.length*5.2+9;
doc.setLineWidth(.45);doc.roundedRect(27,146,84,h,4,4);ct(a.join("\n"),69,146+7,76,5.2,"normal",10.5);
doc.setFont("times","normal");const b=[["Submitted To: "+V("tn")],V("td")].flat().filter(Boolean);
const bl=b.flatMap(x=>doc.splitTextToSize(x,82)),tu=doc.splitTextToSize(V("tu"),82),h2=(bl.length+tu.length)*5.2+9,y2=Math.max(185,146+h+12);
doc.roundedRect(107,y2,90,h2,4,4);let yy=ct(b.join("\n"),152,y2+7,82,5.2,"normal",10.5);ct(V("tu"),152,yy,82,5.2,"bold",10.5)}
$("go").onclick=()=>{mk();$("tpl").value=="1"?l1():l2();$("pv").src=doc.output("bloburl");$("dl").style.display="block"};
$("dl").onclick=()=>doc.save("assignment-cover-page.pdf");
</script></body></html>
